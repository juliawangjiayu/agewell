name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          cd backend
          ruff check app/

      - name: Run tests (mock mode)
        env:
          USE_MOCK: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          pytest tests/ -v --tb=short

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Trigger Railway deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: 27232db5-a4dd-4f14-bac6-2649af675f13
          ENVIRONMENT_ID: a725ea03-900a-4d0a-9f56-9777214b6a16
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Deploying commit $COMMIT_SHA"
          PAYLOAD=$(jq -n \
            --arg serviceId "$SERVICE_ID" \
            --arg environmentId "$ENVIRONMENT_ID" \
            --arg commitSha "$COMMIT_SHA" \
            '{
              query: "mutation Deploy($serviceId: String!, $environmentId: String!, $commitSha: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha) }",
              variables: { serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha }
            }')
          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Railway response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"errors"'; then
            echo "Railway deployment failed: $RESPONSE"
            exit 1
          fi
          if ! echo "$RESPONSE" | grep -q 'serviceInstanceDeployV2'; then
            echo "Unexpected Railway response: $RESPONSE"
            exit 1
          fi
